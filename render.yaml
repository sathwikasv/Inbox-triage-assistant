# Render blueprint for the API (apps/api). Free web service built from apps/api/Dockerfile.
# Secrets (MONGODB_URI, CORS_ORIGIN) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: c16-inbox-triage-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY # optional; rules only when empty
        sync: false
      - key: WEB_ORIGIN # the Amplify URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI # https://<render-url>/providers/yahoo/callback
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
