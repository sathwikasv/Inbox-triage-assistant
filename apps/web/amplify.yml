version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - corepack enable
            - pnpm install --frozen-lockfile
            - pnpm --filter @c16/core build
            - cd apps/web
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
